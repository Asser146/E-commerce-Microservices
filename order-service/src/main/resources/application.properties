spring.application.name=order-service
server.port=8083
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


server.error.include-exception=true
spring.mvc.throw-exception-if-no-handler-found=true


resilience4j.circuitbreaker.instances.productBreaker.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.productBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.productBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.productBreaker.failureRateThreshold=10
resilience4j.circuitbreaker.instances.productBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.productBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.productBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=always
